name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a platform be re-checked from the UI without an empty commit, which
  # matters when the failing OS is not the one on the maintainer's desk.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest, windows-11-arm]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The Windows helper is built on every run so the sandbox suite below
      # exercises the real boundary on real hardware. It is *not* shipped:
      # verify-package refuses dist/native until the suite gates.
      - name: Configure the MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'amd64_arm64' || 'amd64' }}

      # Layer 1 on Linux needs bubblewrap. Without it the sandbox suite would
      # skip silently, which is exactly the kind of quiet gap this project is
      # about.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # Ubuntu 24.04 ships an AppArmor profile that lets bubblewrap create a
      # user namespace but strips CAP_NET_ADMIN inside it, so bwrap cannot
      # bring up loopback and the brokered network path fails with
      # `RTM_NEWADDR: Operation not permitted`. The runner is a throwaway VM.
      # Tolerated if the knob is absent: older kernels do not have it.
      - name: Allow unprivileged user namespaces for bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "apparmor userns restriction knob not present; continuing"

      - run: npm ci
      - run: npm run typecheck
      - name: Compiled Windows path contract (portable C++)
        run: npm run test:windows-native

      - name: Architecture boundaries
        run: npm run lint:arch

      - name: Unit and integration tests with coverage thresholds
        run: npm run coverage

      - run: npm run clean
      - run: npm run build

      # After `clean` and `build`, so the helper survives into test:sandbox.
      - name: Build the Windows AppContainer helper (runner architecture, not shipped)
        if: runner.os == 'Windows'
        run: npm run build:windows-sandbox

      # The tests that decide whether the product works: a real process under
      # the real mechanism, checking that forbidden things actually fail.
      # macOS and Linux are the declared full-support platforms.
      - name: Sandbox isolation tests
        if: runner.os != 'Windows'
        run: npm run test:sandbox

      # Qualification failures must fail CI. Passing this suite alone does not
      # ship the candidate: verify-package still refuses the native helper.
      - name: Sandbox isolation tests (Windows qualification gate)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = npm run test:sandbox 2>&1 | Out-String
          $suiteExit = $LASTEXITCODE
          Write-Output $output
          $tail = ($output -split "`n" | Select-Object -Last 40) -join "`n"
          @(
            '### Windows sandbox qualification',
            '',
            '```',
            $tail.TrimEnd(),
            '```'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($suiteExit -ne 0) {
            # Annotations are available through the public Checks API even
            # when downloading the job log requires an authenticated session.
            $details = (($output -split "`n" | Select-Object -Last 160) -join "`n")
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows sandbox qualification::$details"
            exit $suiteExit
          }

      - name: End-to-end install lifecycle
        if: runner.os != 'Windows'
        run: npm run test:e2e

      # The budgets of spec §12 are enforced, not just measured: a hot-path
      # regression fails the build here instead of being tolerated as
      # mysterious slowness by every user. Thresholds live in
      # test/e2e/perf-budgets.mjs, shared with the e2e regression suite.
      - name: Performance budget gate
        if: runner.os != 'Windows'
        run: node test/e2e/bench.mjs dist/cli.js --enforce

      # Dogfooding: the tool scans its own repository.
      - name: Self-scan
        run: node dist/cli.js scan .

  windows-native-arm64:
    name: Windows native helper (ARM64 compile, not shipped)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - run: node scripts/build-windows-sandbox.mjs arm64

  windows-psec:
    name: Native PSEC qualification (windows-11-arm)
    uses: ./.github/workflows/windows-psec.yml

  package:
    name: package contents
    needs: [verify, windows-native-arm64, windows-psec]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run clean
      - run: npm run build

      - run: npm run verify:package

      # --ignore-scripts on purpose: prepack would rebuild dist, so the
      # tarball would be decided by a different tree than the one just
      # verified. The verifier then reads the archive listing itself rather
      # than trusting the working tree.
      - name: Verify the assembled tarball
        run: node scripts/verify-tarball.mjs

      - name: Refuse a postinstall script
        run: |
          if node -e "process.exit(require('./package.json').scripts.postinstall ? 0 : 1)"; then
            echo "package.json defines postinstall — that is the ChainDrop signature" >&2
            exit 1
          fi

      - name: Refuse runtime dependencies
        run: |
          count=$(node -e "console.log(Object.keys(require('./package.json').dependencies || {}).length)")
          if [ "$count" -ne 0 ]; then
            echo "runtime dependencies are forbidden" >&2
            exit 1
          fi
