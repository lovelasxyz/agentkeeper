name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: release verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # See ci.yml: the 24.04 AppArmor profile denies CAP_NET_ADMIN inside the
      # bubblewrap user namespace, which breaks loopback for the broker relay.
      - name: Allow unprivileged user namespaces for bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "apparmor userns restriction knob not present; continuing"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:arch
      - run: npm run coverage
      - run: npm run clean
      - run: npm run build
      # Gating on the declared full-support platforms. Windows ships no
      # backend (its AppContainer canary never completed), so there is nothing
      # to gate there — the platform reports UNPROTECTED.
      - name: Sandbox isolation tests
        if: runner.os != 'Windows'
        run: npm run test:sandbox

      - name: End-to-end install lifecycle
        if: runner.os != 'Windows'
        run: npm run test:e2e

      # Same gate as ci.yml: a release may not ship a hot-path regression.
      - name: Performance budget gate
        if: runner.os != 'Windows'
        run: node test/e2e/bench.mjs dist/cli.js --enforce

  publish:
    name: npm trusted publish
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run clean
      - run: npm run build
      - run: npm run verify:package

      # The published tarball is proven from the archive listing, not from the
      # working tree, and packed without re-running prepack so the verified
      # tree is exactly the tree that ships.
      - name: Verify the assembled tarball
        run: node scripts/verify-tarball.mjs
      - name: Generate release SBOM
        run: npm sbom --sbom-format cyclonedx > agentkeeper.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: agentkeeper-sbom
          path: agentkeeper.cdx.json
          if-no-files-found: error
      # No stored credential: OIDC trusted publishing supplies a short-lived one
      # from `id-token: write`. 1.0.0 needed a token because a trusted publisher
      # is configured in a package's settings, which cannot exist before the
      # package does; that token was revoked immediately afterwards.
      # The prepack gate rechecks native artifacts after its production build.
      - run: npm publish --provenance --access public
