name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:arch
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

      # No NODE_AUTH_TOKEN: the OIDC trusted publisher provides the credential,
      # and provenance is generated automatically.
      - run: npm publish
