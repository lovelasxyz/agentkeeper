name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: release verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # See ci.yml: the 24.04 AppArmor profile denies CAP_NET_ADMIN inside the
      # bubblewrap user namespace, which breaks loopback for the broker relay.
      - name: Allow unprivileged user namespaces for bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo "apparmor userns restriction knob not present; continuing"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:arch
      - run: npm run coverage
      - run: npm run clean
      - run: npm run build
      # Gating on the declared full-support platforms only. Windows
      # AppContainer is post-1.0 by design (spec §50, §63): reported on every
      # release, never allowed to claim the platform works, and never allowed
      # to block a release it was never in scope for.
      - name: Sandbox isolation tests
        if: runner.os != 'Windows'
        run: npm run test:sandbox

      - name: Sandbox isolation tests (Windows, not yet a release gate)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: npm run test:sandbox

      - name: End-to-end install lifecycle
        if: runner.os != 'Windows'
        run: npm run test:e2e
      - name: Upload Windows x64 boundary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-sandbox-x64
          path: dist/native/win32-x64/agentkeeper-sandbox.exe
          if-no-files-found: error

  windows-arm64:
    name: release Windows ARM64 boundary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - run: node scripts/build-windows-sandbox.mjs arm64
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-sandbox-arm64
          path: dist/native/win32-arm64/agentkeeper-sandbox.exe
          if-no-files-found: error

  publish:
    name: npm trusted publish
    needs: [verify, windows-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run clean
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: release-windows-sandbox-x64
          path: dist/native/win32-x64
      - uses: actions/download-artifact@v4
        with:
          name: release-windows-sandbox-arm64
          path: dist/native/win32-arm64
      - run: npm run verify:package

      # The published tarball is proven from the archive listing, not from the
      # working tree, and packed without re-running prepack so the downloaded
      # Windows helpers survive into the artifact that ships.
      - name: Verify the assembled tarball
        run: npm pack --dry-run --ignore-scripts --json | node scripts/verify-tarball.mjs
      - name: Generate release SBOM
        run: npm sbom --sbom-format cyclonedx > agentkeeper.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: agentkeeper-sbom
          path: agentkeeper.cdx.json
          if-no-files-found: error
      # Trusted publishing is configured in a package's settings, so it cannot
      # exist before the package does. The first release therefore authenticates
      # with NPM_TOKEN; afterwards, configure the trusted publisher on npmjs.com
      # (repo lovelasxyz/agentkeeper, workflow publish.yml), revoke the token and
      # delete this `env:` block — OIDC then needs no stored secret at all.
      # Provenance is unaffected: it comes from `id-token: write` either way.
      # The prepack gate rechecks native artifacts after its production build.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
