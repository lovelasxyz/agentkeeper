name: Frozen Windows restricted-token compatibility experiment

# Frozen at the maintainer's request. Explicit manual investigation only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-restricted-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Restricted-token proof (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'amd64_arm64' || 'amd64' }}
      # Uses built-ins only. Nothing enters dist or the npm package.
      - run: node scripts/probe-windows-restricted.mjs
